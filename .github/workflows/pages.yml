name: GitHub Pages

# Wersja statyczna: cała logika (pobranie feedu ZTM, dekodowanie protobufa,
# filtrowanie taboru) dzieje się w przeglądarce, więc Pages wystarczy.
on:
  push:
    branches:
      - main
      - claude/tram-location-tracking-map-uxql28
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; nie przerywamy trwającego.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:pages

      - uses: actions/configure-pages@v5
        with:
          # Włącza Pages przy pierwszym uruchomieniu - nie trzeba klikać w ustawieniach.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
