name: GitHub Pages

# Wersja statyczna: cała logika (pobranie feedu ZTM, dekodowanie protobufa,
# filtrowanie taboru) dzieje się w przeglądarce, więc Pages wystarczy.
on:
  push:
    branches:
      - main
      - claude/tram-location-tracking-map-uxql28
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; nie przerywamy trwającego.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:pages

      # Próbuje włączyć Pages samo. Token workflow zwykle nie ma do tego prawa
      # ("Resource not accessible by integration") - wtedy trzeba raz kliknąć
      # w ustawieniach repo. Po włączeniu ten krok przechodzi już bez problemu.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
        with:
          enablement: true

      - name: Podpowiedz, jak włączyć Pages
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=Włącz GitHub Pages::Settings → Pages → Build and deployment → Source: GitHub Actions. Potem uruchom ten workflow ponownie."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
